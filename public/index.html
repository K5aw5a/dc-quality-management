<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quality Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
  <script src="/settings.js" defer></script>
</head>
<body>
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="card">
      <div class="login-brand"><img class="brand-logo" alt="" hidden><span class="wordmark">Quality</span></div>
      <div class="brand-stripe"></div>
      <h1>Quality dashboard</h1>
      <p class="muted">Sign in to continue</p>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </section>

  <div id="app-view" class="shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/">
          <img class="brand-logo" alt="" hidden>
          <span class="brand-text"><strong id="project-name">Quality</strong><span>Quality dashboard</span></span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#/" data-route="dashboard">Dashboard</a>
          <a href="#/upload" data-route="upload">Upload</a>
          <a href="#/files" data-route="files">Files</a>
          <details class="menu" data-group="r">
            <summary>Registers</summary>
            <div class="menu-panel" id="nav-registers"></div>
          </details>
          <details class="menu" data-group="settings">
            <summary>Settings</summary>
            <div class="menu-panel">
              <a href="#/settings/registers" data-route="settings/registers">Edit registers</a>
              <a href="#/settings/doctypes" data-route="settings/doctypes">Document types</a>
            </div>
          </details>
        </nav>
        <span class="spacer"></span>
        <details class="menu user-menu">
          <summary><span class="avatar" id="avatar"></span><span id="whoami"></span></summary>
          <div class="menu-panel right">
            <p class="menu-label">Appearance</p>
            <div class="theme-switch" role="group" aria-label="Appearance">
              <button type="button" data-theme-set="auto">Auto</button>
              <button type="button" data-theme-set="light">Light</button>
              <button type="button" data-theme-set="dark">Dark</button>
            </div>
            <button id="logout" type="button" class="menu-item">Sign out</button>
          </div>
        </details>
      </div>
      <div class="brand-stripe"></div>
    </header>

    <main id="main">
      <section id="view-dashboard" hidden></section>
      <section id="view-upload" hidden></section>
      <section id="view-files" hidden></section>
      <section id="view-settings" hidden></section>
      <section id="view-register" hidden>
        <div class="page-head">
          <div><h1 id="reg-title"></h1><p id="reg-desc" class="reg-desc"></p><p id="reg-summary" class="muted"></p></div>
          <div class="actions">
            <a id="reg-import" class="button" href="#/upload">Import file</a>
            <a id="reg-export" class="button" href="#" download>Export .xlsx</a>
            <a id="reg-template" class="button" href="#" download>Blank template</a>
            <a id="reg-edit" class="button" href="#">Edit register</a>
            <button id="new-btn" type="button" class="primary">New</button>
          </div>
        </div>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search…" aria-label="Search">
          <select id="status-filter" aria-label="Filter by status"></select>
        </div>
        <div class="table-wrap">
          <table id="grid"><thead></thead><tbody></tbody></table>
        </div>
        <p id="empty" class="empty" hidden></p>
      </section>
    </main>
  </div>

  <dialog id="editor">
    <form id="edit-form" method="dialog">
      <h3 id="edit-title"></h3>
      <div id="edit-fields" class="fields"></div>
      <p id="edit-source" class="muted small"></p>
      <p id="edit-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="delete-btn" class="danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
      <details id="history" hidden>
        <summary>History</summary>
        <ul id="history-list"></ul>
      </details>
    </form>
  </dialog>
</body>
</html>
